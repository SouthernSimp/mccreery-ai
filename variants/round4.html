<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Round 4 · 9 minimal variants — mccreery.ai</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0a;color:#eee;font-family:'Inter',sans-serif;padding:32px 24px 64px;min-height:100vh}
  .wrap{max-width:1600px;margin:0 auto}
  h1{font-weight:500;font-size:24px;letter-spacing:-.01em;margin-bottom:6px}
  .sub{color:#888;font-size:14px;margin-bottom:24px}
  .sub a{color:#aaa}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:680px){.grid{grid-template-columns:1fr}}
  .card{background:#141414;border:1px solid #222;border-radius:8px;overflow:hidden;transition:border-color .2s,transform .2s}
  .card:hover{border-color:#444;transform:translateY(-2px)}
  .head{padding:10px 14px;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;background:#181818}
  .name{font-size:13px;font-weight:600}
  .open{font-size:11px;color:#888;text-decoration:none;padding:3px 8px;border:1px solid #2a2a2a;border-radius:4px;font-family:ui-monospace,monospace}
  .open:hover{color:#fff;border-color:#555}
  .iframe-wrap{position:relative;width:100%;padding-top:75%;overflow:hidden;background:#000}
  .iframe-wrap iframe{position:absolute;top:0;left:0;width:266.66%;height:266.66%;transform:scale(.375);transform-origin:0 0;border:0;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Round 4 · 9 minimal variants</h1>
  <p class="sub">Live previews below. Click <b style="color:#fff">open →</b> on any tile to see it full-size. <a href="/variants/">← back to all variants</a></p>
  <div class="grid" id="g"></div>
</div>
<script>
  const v=[
    ['mono','Monochrome Minimal','greyscale, hairline, off-white on near-black'],
    ['swiss','Swiss Brutal','light cream + electric red period, big Inter Tight'],
    ['photo','Image-led Editorial','full-bleed warm gradient hero + Fraunces serif'],
    ['midnight2','Midnight Minimal','cobalt + pale violet + single soft blue accent'],
    ['paper','Newspaper Light','cream + Fraunces + hairlines, broadsheet vibe'],
    ['slate','Soft Slate','muted slate + peach accent used twice'],
    ['canvas','Canvas Cream','warm cream + espresso text + forest green CTA'],
    ['duotone','Duotone Dusk','plum + dusty rose 60/40 split, gallery feel'],
    ['grid','Tight Grid','Braun-style spec sheet, inverted white block'],
  ];
  const g=document.getElementById('g');
  v.forEach(([id,name,desc])=>{
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML=`
      <div class="head">
        <div><div class="name">${name}</div><div style="font-size:11px;color:#777;margin-top:2px">${desc}</div></div>
        <a class="open" href="/variants/${id}.html" target="_blank">open →</a>
      </div>
      <div class="iframe-wrap"><iframe src="/variants/${id}.html" loading="lazy"></iframe></div>
    `;
    g.appendChild(el);
  });
</script>
</body>
</html>
